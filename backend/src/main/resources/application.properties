spring.application.name=bitadilat-payment

# Prototipte gerçek kimlik doğrulama olmadığı için varsayılan olarak yalnızca bu bilgisayardan erişilir.
server.address=${BITADILAT_BIND:127.0.0.1}
server.port=${BITADILAT_PORT:8090}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Anahtarlar yalnızca ortam değişkenlerinden okunur, koda yazılmaz.
craftgate.api-key=${CRAFTGATE_API_KEY:}
craftgate.secret-key=${CRAFTGATE_SECRET_KEY:}
craftgate.callback-key=${CRAFTGATE_CALLBACK_KEY:}
craftgate.base-url=${CRAFTGATE_BASE_URL:https://sandbox-api.craftgate.io}

# Bankadan dönen tarayıcının ulaşacağı adres. Prototip bu adresten açılmalıdır.
bitadilat.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8090}
bitadilat.preview-dir=${BITADILAT_PREVIEW_DIR:../preview}

spring.datasource.url=jdbc:h2:file:./data/bitadilat;LOCK_TIMEOUT=30000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
