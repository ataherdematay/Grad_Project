spring.application.name=bitadilat-api
# Profil verilmezse geliştirme ortamı açılır. Sunucuda SPRING_PROFILES_ACTIVE=prod verilir.
spring.profiles.default=dev

# Prototipte gerçek kimlik doğrulama olmadığı için varsayılan olarak yalnızca bu bilgisayardan erişilir.
server.address=${BITADILAT_BIND:127.0.0.1}
server.port=${BITADILAT_PORT:8090}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Anahtarlar yalnızca ortam değişkenlerinden okunur, koda yazılmaz.
craftgate.api-key=${CRAFTGATE_API_KEY:}
craftgate.secret-key=${CRAFTGATE_SECRET_KEY:}
craftgate.callback-key=${CRAFTGATE_CALLBACK_KEY:}
craftgate.base-url=${CRAFTGATE_BASE_URL:https://sandbox-api.craftgate.io}

# Bankadan dönen tarayıcının ulaşacağı adres. Prototip bu adresten açılmalıdır.
bitadilat.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8090}
bitadilat.preview-dir=${BITADILAT_PREVIEW_DIR:../preview}

# Şema yalnızca Flyway ile değişir; Hibernate yalnızca uyumu kontrol eder.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# JWT (HS256) ve adres şifreleme anahtarı yalnızca ortam değişkenlerinden gelir.
# dev profilinde sabit geliştirme değerleri vardır; prod'da yoksa uygulama açılmaz.
bitadilat.jwt.secret=${JWT_SECRET}
bitadilat.crypto.address-key=${ADDRESS_KEY}

# Admin web için izinli origin kalıpları (virgülle ayrılmış). Boşsa CORS kapalıdır.
bitadilat.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# OpenAPI yalnızca dev'de açık (application-dev.properties).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
