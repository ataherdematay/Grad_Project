# Sunucuda tüm bağlantı bilgileri ortam değişkenlerinden gelir; varsayılan yok, eksikse uygulama açılmaz.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
server.address=${BITADILAT_BIND:0.0.0.0}
bitadilat.public-base-url=${APP_PUBLIC_BASE_URL}

# JWT_SECRET ve ADDRESS_KEY zorunlu (varsayılan yok). CORS_ALLOWED_ORIGINS admin web adresi olmalı.
bitadilat.jwt.secret=${JWT_SECRET}
bitadilat.crypto.address-key=${ADDRESS_KEY}
bitadilat.cors.allowed-origins=${BITADILAT_CORS_ORIGINS:${CORS_ALLOWED_ORIGINS:}}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Medya: MEDIA_SIGNING_KEY (en az 32 bayt) ve MEDIA_DIR zorunlu; adresler APP_PUBLIC_BASE_URL üzerinden verilir.
bitadilat.media.signing-key=${MEDIA_SIGNING_KEY}
bitadilat.media.dir=${MEDIA_DIR}
bitadilat.media.url-base=${bitadilat.public-base-url}

# E-posta (SmtpEmailSender): SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD ortam değişkenlerini Spring doğrudan okur.
bitadilat.mail.from=${BITADILAT_MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# İlk admin (yalnızca hiç admin yoksa kullanılır).
bitadilat.admin.email=${BITADILAT_ADMIN_EMAIL:}
bitadilat.admin.password=${BITADILAT_ADMIN_PASSWORD:}

# Craftgate callback anahtarı prod'da zorunlu (ProdConfigValidator).
craftgate.callback-key=${CRAFTGATE_CALLBACK_KEY:}
