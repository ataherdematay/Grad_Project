# Yerel PostgreSQL (Homebrew). Veritabanı: createdb bitadilat
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bitadilat}
spring.datasource.username=${DB_USER:${USER}}
spring.datasource.password=${DB_PASSWORD:}

# Yalnızca geliştirme: sabit sır ve anahtar. Gerçek ortamda JWT_SECRET ve ADDRESS_KEY verilir.
bitadilat.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
bitadilat.crypto.address-key=${ADDRESS_KEY:3HQaIRhGZ/HKzRvfo/figgtQosgoaA3T1GKbbBEEn5o=}
bitadilat.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

bitadilat.media.signing-key=${MEDIA_SIGNING_KEY:dev-only-media-signing-key-change-me-0123456789}
bitadilat.media.dir=${MEDIA_DIR:./data/media}
