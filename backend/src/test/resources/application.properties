# dev profili yalnizca loopback uzerinde acilir (DevProfileGuard); test dosyasi main application.properties dosyasini golgeler.
server.address=127.0.0.1
server.error.include-message=never
craftgate.api-key=test-api-key
craftgate.secret-key=test-secret-key
craftgate.callback-key=
craftgate.base-url=https://sandbox-api.craftgate.io
bitadilat.public-base-url=http://localhost:8090
bitadilat.preview-dir=../preview

# Docker açıksa TestDatabaseConfig bunu Testcontainers ile ezer.
# Değilse yerel PostgreSQL kullanılır: createdb bitadilat_test
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/bitadilat_test}
spring.datasource.username=${TEST_DB_USER:${USER}}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.flyway.clean-disabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Testlere özel sabit sır ve anahtar
bitadilat.jwt.secret=test-only-jwt-secret-0123456789abcdef-0123456789
bitadilat.crypto.address-key=3HQaIRhGZ/HKzRvfo/figgtQosgoaA3T1GKbbBEEn5o=
bitadilat.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

bitadilat.media.signing-key=test-only-media-signing-key-0123456789abcdef
bitadilat.media.dir=${java.io.tmpdir}/bitadilat-test-media-${random.uuid}
bitadilat.media.url-base=
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
# Zamanlayıcı testlerde elle çağrılır; arka plandaki çalışma testlerle yarışmasın.
bitadilat.jobs.expiry-interval=PT24H
bitadilat.jobs.autocomplete-interval=PT24H
bitadilat.jobs.payment-sweep-interval=PT24H

# Testler prototip uç noktalarını dev profili olmadan da sınar.
bitadilat.prototype-api.enabled=true
