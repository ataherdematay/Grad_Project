<html lang="tr">
<head>

<style>
/* Layout: a 16:9 stage like a short explainer film; header shows the chapter, caption under the stage, chapter bar + controls at the bottom. */
:root {
  --bg: #F1F5F4;
  --surface: #FFFFFF;
  --ink: #10272E;
  --muted: #5A6D72;
  --line: #D3DEDA;
  --track: #B5C6C1;
  --lane: #E7EEEC;
  --primary: #0F4C5C;
  --primary-soft: #DDEBEF;
  --trust: #107A5B;
  --trust-soft: #E0F1EA;
  --warn: #C2601B;
  --warn-soft: #FBEBDF;
  --info: #1F6F94;
  --info-soft: #E1EEF6;
  --danger: #A3352B;
  --danger-soft: #F8E4E1;
  --coin: #E3A92A;
  --coin-ink: #3A2800;
  --font: "Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A161A; --surface: #12232A; --ink: #E2ECE9; --muted: #9DB2B5; --line: #27424B; --track: #3D5D66; --lane: #0F1F26;
    --primary: #7CC3D4; --primary-soft: #16343D; --trust: #5BCB9F; --trust-soft: #123129; --warn: #F0A06A; --warn-soft: #36251A;
    --info: #7DB9DB; --info-soft: #142D3A; --danger: #EE8E84; --danger-soft: #3A1E1B; --coin: #F2C14E; --coin-ink: #2A1D00; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A161A; --surface: #12232A; --ink: #E2ECE9; --muted: #9DB2B5; --line: #27424B; --track: #3D5D66; --lane: #0F1F26;
  --primary: #7CC3D4; --primary-soft: #16343D; --trust: #5BCB9F; --trust-soft: #123129; --warn: #F0A06A; --warn-soft: #36251A;
  --info: #7DB9DB; --info-soft: #142D3A; --danger: #EE8E84; --danger-soft: #3A1E1B; --coin: #F2C14E; --coin-ink: #2A1D00; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 22px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; }
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
.chapter { display: grid; gap: 2px; min-width: 0; }
.chapter small { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); }
.chapter h1 { margin: 0; font-size: clamp(20px, 2.6vw, 28px); font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
.counter { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.stage-box { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
svg#stage { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
.caption { min-height: 3.2em; font-size: clamp(15px, 1.7vw, 19px); font-weight: 600; text-wrap: pretty; padding: 2px 4px; }
.bar { display: flex; gap: 4px; }
.bar button { flex: var(--w) 1 0; height: 10px; border: 0; border-radius: 5px; background: var(--lane); position: relative; overflow: hidden; cursor: pointer; padding: 0; }
.bar button i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--primary); border-radius: 5px; }
.bar button.done i { width: 100%; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { font: inherit; font-size: 14px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--primary); color: var(--surface); border-color: var(--primary); min-width: 96px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: inherit; font-size: 12.5px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--muted); padding: 5px 10px; border-radius: 999px; cursor: pointer; }
.chips button[aria-current="true"] { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* SVG */
.nd rect { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
.ndi { transform-box: fill-box; transform-origin: center; }
.nd .ib { fill: var(--lane); }
.nd use { color: var(--muted); }
.nd .l1 { font: 800 20px var(--font); fill: var(--ink); }
.nd .l2 { font: 600 14.5px var(--font); fill: var(--muted); }
.nd.vault rect { fill: var(--info-soft); stroke: var(--info); stroke-width: 2.5; }
.nd.vault .ib { fill: var(--surface); } .nd.vault use { color: var(--info); }
.nd.hl rect { stroke: var(--primary); stroke-width: 3.5; } .nd.hl .ib { fill: var(--primary-soft); } .nd.hl use { color: var(--primary); }
.nd.hlp rect, .nd.hlp2 rect { stroke: var(--trust); stroke-width: 3.5; } .nd.hlp .ib, .nd.hlp2 .ib { fill: var(--trust-soft); } .nd.hlp use, .nd.hlp2 use { color: var(--trust); }
.nd.hld rect { stroke: var(--danger); stroke-width: 3.5; } .nd.hld .ib { fill: var(--danger-soft); } .nd.hld use { color: var(--danger); }
.nd.frozen rect { stroke: var(--danger); stroke-dasharray: 8 6; }
.ln { fill: none; stroke: var(--track); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.ln.main { stroke: var(--primary); } .ln.pro { stroke: var(--trust); } .ln.ref { stroke: var(--warn); } .ln.adm { stroke: var(--danger); stroke-dasharray: 6 8; }
.ah { fill: var(--track); } .ah.main { fill: var(--primary); } .ah.pro { fill: var(--trust); } .ah.ref { fill: var(--warn); } .ah.adm { fill: var(--danger); }
.coin rect { fill: var(--coin); stroke: var(--coin-ink); stroke-width: 2; }
.coin text { font: 800 16px var(--font); fill: var(--coin-ink); text-anchor: middle; dominant-baseline: central; }
.coin.red rect { fill: var(--warn); stroke: var(--warn); } .coin.red text { fill: var(--surface); }
.tag { font: 800 16px var(--font); }
.tag.info { fill: var(--info); } .tag.pro { fill: var(--trust); } .tag.warn { fill: var(--warn); } .tag.danger { fill: var(--danger); } .tag.muted { fill: var(--muted); } .tag.primary { fill: var(--primary); }
.big { font: 800 56px var(--font); fill: var(--ink); text-anchor: middle; }
.sub { font: 600 24px var(--font); fill: var(--muted); text-anchor: middle; }
.card-r rect.bg { fill: var(--lane); }
.card-r .ct { font: 800 22px var(--font); }
.card-r .ct.why { fill: var(--danger); } .card-r .ct.target { fill: var(--primary); }
.card-r .cl { font: 600 19px var(--font); fill: var(--ink); }
.card-r .dot { fill: var(--muted); }
.rank rect { fill: var(--primary); } .rank text { font: 800 22px var(--font); fill: var(--surface); text-anchor: middle; dominant-baseline: central; }
.rank.dim rect { fill: var(--muted); }
.ex { font: 600 18px var(--font); fill: var(--muted); }
.icon-ink { color: var(--primary); } .icon-pro { color: var(--trust); } .icon-warn { color: var(--warn); } .icon-danger { color: var(--danger); } .icon-info { color: var(--info); }
.fin-t { font: 800 34px var(--font); fill: var(--ink); }
.fin-l { font: 600 22px var(--font); fill: var(--ink); }
.fin-s { font: 600 18px var(--font); fill: var(--muted); }
.fin-box rect { fill: var(--primary-soft); stroke: var(--primary); stroke-width: 2; }
.fin-box text { font: 800 21px var(--font); fill: var(--primary); }
</style>
</head>

<div class="wrap">

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var $ = function (id) { return document.getElementById(id); };
  var layer = $("layer");
  var tracks = [], caps = [];
  function clamp(x) { return Math.max(0, Math.min(1, x)); }
  function ease(k) { return k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }

  }
  function txt(x, y, s, cls, parent, anchor) { var e = mk("text", { x: x, y: y, "class": cls }, parent); if (anchor) e.setAttribute("text-anchor", anchor); e.textContent = s; return e; }

  // ---- primitives (all time-driven, so pausing and jumping are exact) ----
  function node(cx, cy, w, h, icon, l1, l2, cls) {
    var outer = mk("g", { transform: "translate(" + (cx - w / 2) + " " + (cy - h / 2) + ")", "class": "nd " + (cls || "") });
    var inner = mk("g", { "class": "ndi" }, outer);
    mk("rect", { width: w, height: h, rx: 16 }, inner);
    var r = 22;
    mk("circle", { "class": "ib", cx: 14 + r, cy: h / 2, r: r }, inner);
    mk("use", { href: "#" + icon, x: 14 + r - 13, y: h / 2 - 13, width: 26, height: 26 }, inner);
    var tx = 14 + 2 * r + 12;
    var a = txt(tx, l2 ? h / 2 - 3 : h / 2 + 7, l1, "l1", inner);
    var b = l2 != null ? txt(tx, h / 2 + 19, l2, "l2", inner) : null;
    outer.style.opacity = 0;
    return { g: outer, inner: inner, cx: cx, cy: cy, w: w, h: h, l1: a, sub: b, top: cy - h / 2, bottom: cy + h / 2, left: cx - w / 2, right: cx + w / 2 };
  }
  function appear(n, t0, t1) {
    tracks.push(function (t) {
      var p = ease(clamp((t - t0) / 0.5));

  function polyLen(pts) { var L = 0; for (var i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }

  function line(pts, kind, t0, t1, d) {
    d = d || 0.6;
    var g = mk("g", {});
    var dstr = "M" + pts.map(function (p) { return p[0] + " " + p[1]; }).join("L");
    var path = mk("path", { d: dstr, "class": "ln " + kind }, g);
    var L = polyLen(pts);
    path.style.strokeDasharray = kind === "adm" ? "6 8" : L + " " + L;
    var a = pts[pts.length - 1], b = pts[pts.length - 2];

  }
  function coin(label, legs, show, until, red) {
    var g = mk("g", { "class": "coin" + (red ? " red" : "") });

    mk("rect", { x: -w / 2, y: -17, width: w, height: 34, rx: 17 }, g);
    txt(0, 1, label, "", g);
    var first = legs[0];
    if (show == null) show = first.t0;
    tracks.push(function (t) {
      if (t < show || (until != null && t >= until + 0.4)) { g.style.opacity = 0; return; }
      g.style.opacity = until != null && t >= until ? 1 - clamp((t - until) / 0.4) : Math.min(1, (t - show) / 0.3);

  }
  function icon(id, x, y, size, c, t0, t1, spin) {

  function reasonCard(title, lines, kind, t0) {
    var g = mk("g", { "class": "card-r", transform: "translate(140 420)" });
    mk("rect", { "class": "bg", width: 1000, height: 70 + lines.length * 38, rx: 18 }, g);
    txt(32, 46, title, "ct " + kind, g);
    lines.forEach(function (s, i) { mk("circle", { "class": "dot", cx: 40, cy: 86 + i * 38, r: 4 }, g); txt(56, 92 + i * 38, s, "cl", g); });
    fade(g, t0);
  }

        tag(220, 345, "Güvence yok", "danger", 4.9);
        return [[0, "Müşteri ustaya doğrudan öder; para platformdan hiç geçmez."], [3.5, "Platform yalnızca ustadan ilan ya da teklif ücreti alır. Bir sorun olursa müşterinin başvurabileceği bir kasa yoktur."]];
      } }),
    { small: "Sonuç", title: "Neden bugünkü modeli seçtik?", chip: "Sonuç", dur: 12, build: function () {
      fade(txt(140, 120, "Neden bugünkü model?", "fin-t"), 0.2);
      var items = [["Müşteri korunur", "Para iş bitip onaylanana kadar ustaya geçmez; sorun olursa iade ya da admin kararı.", 0.9],
        ["Usta korunur", "Para işten önce tahsil edildi; müşteri onay vermezse 48 saat sonra otomatik aktarım.", 2.6],
        ["Bugün çalışıyor", "Craftgate sandbox'ında gerçek 3D Secure, iade ve şikayet kararlarıyla test edildi.", 4.3]];
      items.forEach(function (it, i) {
        var y = 205 + i * 105;
        icon("i-check", 165, y + 8, 40, "icon-pro", it[2]);
        fade(txt(205, y + 4, it[0], "fin-l"), it[2] + 0.2);
        fade(txt(205, y + 36, it[1], "fin-s"), it[2] + 0.4);
      });
      var box = mk("g", { "class": "fin-box", transform: "translate(140 545)" });
      mk("rect", { width: 1000, height: 86, rx: 18 }, box);
      txt(32, 52, "Yayından önce: aynı akış, para lisanslı ödeme kuruluşunda (Alternatif 1).", "", box);
      fade(box, 6.2);
      caption([[0, "Bugünkü model hem müşteriyi hem ustayı koruyor ve teslim için çalışır durumda."], [6, "Gerçek kullanıcıya açılmadan önce paranın beklediği yeri lisanslı ödeme kuruluşuna taşıyacağız; ekranlar ve kurallar aynı kalacak."]]);
    } }
  ];

  function altScene(o) {
    return { small: o.small, title: o.title, chip: o.chip, dur: 14 + (o.lines.length > 3 ? 1 : 0), build: function () {
      var m = node(220, 260, 196, 86, "i-person", "Müşteri", "kartı");
      var x = node(640, 260, 250, 96, o.mid[0], o.mid[1], o.mid[2], o.noWait ? "" : (o.waitLeft ? "" : "vault"));
      var u = node(1060, 260, 196, 86, o.right[0], o.right[1], o.right[2]);
      if (o.waitLeft) m.g.classList.add("vault");
      appear(m, 0.1); appear(x, 0.35); appear(u, 0.6);
      rank(o.r, o.r !== 1, 76, 78, 0.1);
      fade(txt(116, 86, o.ex, "ex"), 0.3);
      if (o.r !== 6) { line([[318, 260], [513, 260]], "track", 0.8, null, 0.5); line([[765, 260], [960, 260]], "track", 1.0, null, 0.5); }
      var L = { ms: [220, 195], xs: [640, 190], us: [1060, 195] };
      var caps1 = o.anim(L);
      var t0 = o.r === 1 ? 6.6 : 8.2;
      reasonCard(o.cardTitle, o.lines, o.kind, t0);
      caps1.push([t0, o.kind === "target" ? "Bu model önerdiğimiz hedef; şu an kullanmama nedenimiz zaman ve kayıt süreci." : "Bu model BiTadilat için neden uygun değil:"]);
      caption(caps1);
    } };
  }

  // ---- player ----
  var cur = 0, t = 0, playing = !reduce, last = null;
  var bar = $("bar"), chips = $("chips");
  scenes.forEach(function (s, i) {
    var b = document.createElement("button"); b.type = "button"; b.style.setProperty("--w", s.dur); b.setAttribute("aria-label", (i + 1) + ". sahne: " + s.chip);
    b.appendChild(document.createElement("i")); b.addEventListener("click", function () { go(i); }); bar.appendChild(b);
    var c = document.createElement("button"); c.type = "button"; c.textContent = s.chip; c.addEventListener("click", function () { go(i); }); chips.appendChild(c);
  });
  function build(i) {
    while (layer.firstChild) layer.removeChild(layer.firstChild);
    tracks = []; caps = [];
    scenes[i].build();
    $("chSmall").textContent = scenes[i].small; $("chTitle").textContent = scenes[i].title;
    $("counter").textContent = (i + 1) + " / " + scenes.length;
    Array.prototype.forEach.call(chips.children, function (c, j) { c.setAttribute("aria-current", j === i ? "true" : "false"); });
  }
  function draw() {
    tracks.forEach(function (f) { f(t); });
    var c = ""; caps.forEach(function (x) { if (t >= x[0]) c = x[1]; });
    if ($("caption").textContent !== c) $("caption").textContent = c;
    Array.prototype.forEach.call(bar.children, function (b, j) {
      b.classList.toggle("done", j < cur);
      b.firstChild.style.width = j === cur ? (100 * Math.min(1, t / scenes[cur].dur)) + "%" : (j < cur ? "100%" : "0");
    });
  }
  function go(i) { cur = Math.max(0, Math.min(scenes.length - 1, i)); build(cur); t = playing ? 0 : scenes[cur].dur; draw(); }
  function setPlaying(p) { playing = p; $("play").textContent = p ? "Duraklat" : "Oynat"; last = null; }
  function loop(ts) {
    if (playing) {
      if (last != null) t += Math.min(0.1, (ts - last) / 1000);
      last = ts;
      if (t >= scenes[cur].dur) {
        if (cur < scenes.length - 1) { cur++; build(cur); t = 0; }
        else { t = scenes[cur].dur; setPlaying(false); }
      }
      draw();
    }
    requestAnimationFrame(loop);
  }
  $("play").addEventListener("click", function () {
    if (!playing && cur === scenes.length - 1 && t >= scenes[cur].dur) { go(0); t = 0; }
    if (!playing && t >= scenes[cur].dur) t = 0;
    setPlaying(!playing);
  });
  $("next").addEventListener("click", function () { go(cur + 1); });
  $("prev").addEventListener("click", function () { go(cur - 1); });
  $("restart").addEventListener("click", function () { setPlaying(!reduce); go(0); });
  setPlaying(playing);
  build(0); t = playing ? 0 : scenes[0].dur; draw();
  requestAnimationFrame(loop);
})();
</script>
