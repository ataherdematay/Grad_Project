name: bitadilat_ui
description: "BiTadilat tasarim sistemi, tema ve ortak bilesenler."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Manrope (SIL OFL 1.1), google/fonts deposundaki ofl/manrope/ değişken
  # fontu; lisans metni fonts/OFL.txt.
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope-VariableFont_wght.ttf
