name: flutter
on:
  push:
    branches: [feature/flutter-app, develop, main]
  pull_request:
    branches: [feature/flutter-app, develop, main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          for d in apps/mobile apps/admin packages/bitadilat_ui packages/bitadilat_api; do
            (cd $d && flutter analyze)
          done
      - name: Test
        run: |
          for d in apps/mobile apps/admin packages/bitadilat_ui; do
            (cd $d && flutter test)
          done
          (cd packages/bitadilat_api && dart test)
  admin-web:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build admin web
        working-directory: apps/admin
        run: flutter build web --dart-define=API_BASE_URL=http://localhost:8090
